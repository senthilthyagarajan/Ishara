<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ishara – Dumb Charades</title>
  <meta name="description" content="Tap for a random English or Hindi movie to act out. Works offline." />
  <meta name="theme-color" content="#fbfcff" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ishara" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..800&display=swap" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <main id="app">
    <header class="hero">
      <img class="hero-icon" src="icons/icon.svg" alt="" width="48" height="48" />
      <h1>Ishara</h1>
    </header>

    <section class="stage" aria-live="polite">
      <div class="welcome" id="welcome">
        <span class="welcome-emoji" aria-hidden="true">🎬</span>
        <p>Ready to act?</p>
      </div>

      <article class="movie-card" id="card" hidden>
        <div class="mc-top">
          <span class="mc-num" id="m-count"></span>
          <span class="mc-unit" id="m-unit"></span>
        </div>
        <div class="mc-letters" id="m-words" aria-label="Letters in each word"></div>
        <div class="mc-foot">
          <p class="mc-title" id="m-title"></p>
          <p class="mc-meta"><span id="m-lang"></span> · <span id="m-year"></span></p>
        </div>
      </article>
    </section>

    <button class="go" id="go">Get a movie</button>
  </main>

  <script>
    // When a new version of the app takes over, reload once so the page and its code always match.
    if ("serviceWorker" in navigator) {
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!reloaded && navigator.serviceWorker.controller) { reloaded = true; location.reload(); }
      });
    }
  </script>
  <script src="movies.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
